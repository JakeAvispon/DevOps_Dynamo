<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censo de las Provincias - Skyrim Style</title>
    <style>
        /* Importamos una fuente rústica similar a la del juego */
        @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');

        body {
            background-color: #1a1a1a;
            background-image: url('https://www.transparenttextures.com/patterns/dark-leather.png');
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'MedievalSharp', cursive;
        }

        /* Contenedor tipo pergamino */
        .pergamino {
            background: #e3d3a3;
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
            border: 15px solid #3b2b1a;
            border-style: double;
            color: #2b1a0a;
            padding: 50px;
            width: 90%;
            max-width: 1000px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            position: relative;
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            text-transform: uppercase;
            border-bottom: 3px double #3b2b1a;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 1.1em;
        }

        th {
            background: #3b2b1a;
            color: #e3d3a3;
            padding: 15px;
            text-transform: uppercase;
            border: 1px solid #2b1a0a;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(59, 43, 26, 0.3);
            text-align: center;
            border-left: 1px solid rgba(59, 43, 26, 0.2);
            border-right: 1px solid rgba(59, 43, 26, 0.2);
        }

        tr:nth-child(even) {
            background-color: rgba(59, 43, 26, 0.05);
        }

        .loading {
            text-align: center;
            font-style: italic;
            font-size: 1.5em;
            margin: 20px;
        }

        /* Efecto de quemado en las esquinas */
        .pergamino::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.2);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="pergamino">
        <h1>📜 Registro de Tierras de Tamriel 📜</h1>
        
        <div id="status" class="loading">Consultando a los ancestros...</div>

        <table id="tabla-datos" style="display: none;">
            <thead>
                <tr>
                    <th>Estado</th>
                    <th>Clima (°C)</th>
                    <th>Humedad</th>
                    <th>Costo Hospedaje</th>
                    <th>Traslado</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
                </tbody>
        </table>
    </div>

    <script>
        // IP de tu instancia EC2 configurada
        const API_URL = 'http://18.220.13.9:5000/api/estados';

        async function invocarDatos() {
            const statusDiv = document.getElementById('status');
            const tabla = document.getElementById('tabla-datos');
            const cuerpo = document.getElementById('cuerpo-tabla');

            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) throw new Error('Error en la conexión');

                const datos = await response.json();

                // Limpiar tabla
                cuerpo.innerHTML = '';

                datos.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${item.Estado}</strong></td>
                        <td>${item.Temperatura}°C</td>
                        <td>${item.Humedad}%</td>
                        <td>${item.Costo_Alojamiento} 💰</td>
                        <td>${item.Tiempo_Traslado}h</td>
                    `;
                    cuerpo.appendChild(row);
                });

                // Mostrar tabla y ocultar mensaje de carga
                statusDiv.style.display = 'none';
                tabla.style.display = 'table';

            } catch (error) {
                statusDiv.innerHTML = "❌ Los dragones han bloqueado el camino (Error al conectar con la EC2)";
                statusDiv.style.color = "red";
                console.error('Error:', error);
            }
        }

        // Llamar a la función al cargar la página
        invocarDatos();
    </script>
</body>
</html>
